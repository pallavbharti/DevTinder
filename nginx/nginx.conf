# Port 80: sirf certificate renewal + baaki sab HTTPS pe bhejo
server {
    listen 80;
    server_name api.devtinder24.me;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: asli app (encrypted)
server {
    listen 443 ssl;
    server_name api.devtinder24.me;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.devtinder24.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.devtinder24.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}